[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trial_trajectories"
version = "0.1.0"
description = "Treatment effect or natural course: causal estimators and sparse follow-up checked against a randomised trial"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
